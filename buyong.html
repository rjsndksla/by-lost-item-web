<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부용관 - 메인 허브</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 모바일 최적화 스타일 */
    @media (max-width: 768px) {
      .hub-container {
        padding: 40px 20px;
        margin: 20px;
        border-radius: 20px;
      }
      
      .hub-main-img {
        width: 150px;
        height: 150px;
        margin-bottom: 30px;
      }
      
      h1 {
        font-size: 3rem;
        margin-bottom: 25px;
      }
      
      .hub-desc {
        font-size: 1.3rem;
        line-height: 1.8;
        margin-bottom: 40px;
      }
      
      .hub-desc span {
        display: block;
        margin-bottom: 8px;
      }
      
      .hub-links {
        gap: 25px;
      }
      
      .hub-card {
        padding: 30px 25px;
        border-radius: 18px;
        font-size: 1.2rem;
      }
      
      .hub-card-img {
        width: 80px;
        height: 80px;
        margin-right: 25px;
      }
      
      .hub-card span {
        font-size: 1.4rem;
        font-weight: 600;
      }
    }
    
    /* 작은 모바일 화면 */
    @media (max-width: 480px) {
      .hub-container {
        padding: 30px 15px;
        margin: 15px;
      }
      
      .hub-main-img {
        width: 120px;
        height: 120px;
        margin-bottom: 25px;
      }
      
      h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
      }
      
      .hub-desc {
        font-size: 1.1rem;
        margin-bottom: 35px;
      }
      
      .hub-card {
        padding: 25px 20px;
      }
      
      .hub-card-img {
        width: 70px;
        height: 70px;
        margin-right: 20px;
      }
      
      .hub-card span {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="hub-container">
    <img src="school-icon.png" alt="부용관 대표 이미지" class="hub-main-img">
    <h1>부용관</h1>
    <p class="hub-desc">
      <span style="font-weight:bold; font-size:1.15em;">언제나 싱그러움이 가득 찬</span><br>
      <span style="font-size:1.08em;">즐거운 배움터에서</span><br>
      <span style="font-size:1.08em;">미래의 꿈을 실현하는</span><br>
      <span style="font-weight:bold;">부용인</span>
    </p>
    <div class="hub-links">
      <a href="index.html" class="hub-card">
        <img src="lostfound-icon.png" alt="분실물 찾기" class="hub-card-img">
        <span>부용고 분실물 찾기</span>
      </a>
      <a href="club.html" class="hub-card">
        <img src="club-icon.png" alt="동아리 홍보관" class="hub-card-img">
        <span>동아리 온라인 홍보관</span>
      </a>
    </div>
  </div>
</body>
</html>
