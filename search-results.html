<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="분실물 검색 결과를 제공하는 분실물 찾기 서비스입니다.">
    <title>검색 결과 - 분실물 찾기 서비스</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <nav class="nav">
                <a href="buyong.html" class="back-to-hub-btn">← 부용관으로 돌아가기</a>
                <a href="index.html" class="logo">부용고 분실물 찾기</a>
                
                <!-- 햄버거 메뉴 버튼 (모바일) -->
                <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
                
                <!-- 데스크톱 네비게이션 -->
                <ul class="nav-menu desktop-menu">
                    <li class="nav-item"><a href="index.html" class="nav-link">홈</a></li>
                    <li class="nav-item"><a href="list.html" class="nav-link">등록된 분실물</a></li>
                    <li class="nav-item"><a href="register.html" class="nav-link">분실물 등록/찾기</a></li>
                </ul>
                
                <!-- 데스크톱 인증 -->
                <div id="auth-container" class="desktop-auth">
                    <button id="loginBtn" class="auth-btn" onclick="openAuthModal()">로그인/회원가입</button>
                </div>
                <div id="user-info" class="desktop-user" style="display: none;"></div>
            </nav>
            
            <!-- 모바일 메뉴 오버레이 -->
            <div class="mobile-menu-overlay" id="mobileMenuOverlay">
                <div class="mobile-menu-content">
                    <div class="mobile-menu-header">
                        <h3>메뉴</h3>
                        <button class="mobile-menu-close" onclick="toggleMobileMenu()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <div class="mobile-menu-main">
                        <ul class="mobile-nav-menu">
                            <li class="mobile-nav-item">
                                <a href="index.html" class="mobile-nav-link" onclick="toggleMobileMenu()">
                                    <i class="fas fa-home"></i>
                                    <span>홈</span>
                                </a>
                            </li>
                            <li class="mobile-nav-item">
                                <a href="list.html" class="mobile-nav-link" onclick="toggleMobileMenu()">
                                    <i class="fas fa-list"></i>
                                    <span>등록된 분실물</span>
                                </a>
                            </li>
                            <li class="mobile-nav-item">
                                <a href="register.html" class="mobile-nav-link" onclick="toggleMobileMenu()">
                                    <i class="fas fa-plus-circle"></i>
                                    <span>분실물 등록/찾기</span>
                                </a>
                            </li>
                        </ul>
                        
                        <!-- 모바일 인증 -->
                        <div class="mobile-auth-section">
                            <div id="mobile-auth-container">
                                <button class="mobile-auth-btn" onclick="openAuthModal(); toggleMobileMenu();">
                                    <i class="fas fa-sign-in-alt"></i>
                                    <span>로그인/회원가입</span>
                                </button>
                            </div>
                            <div id="mobile-user-info" style="display: none;"></div>
                        </div>
                    </div>
                    
                    <!-- 모바일 메뉴 하단에 부용관으로 돌아가기 버튼 추가 -->
                    <div class="mobile-back-to-hub-section">
                        <a href="buyong.html" class="mobile-back-to-hub-btn" onclick="toggleMobileMenu()">
                            <i class="fas fa-arrow-left"></i>
                            <span>부용관으로 돌아가기</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <main class="main-content">
        <div class="container">
            <section id="search-results" class="section active">
                <div class="search-results-header">
                    <h1 class="section-title">검색 결과</h1>
                    <div class="search-info">
                        <div id="searchTerm" class="search-term"></div>
                        <div id="searchCount" class="search-count"></div>
                    </div>
                    <button onclick="location.href='index.html'" class="search-results-back-btn">
                        <i class="fas fa-home"></i> 홈으로 돌아가기
                    </button>
                </div>
                
                <div class="items-grid" id="searchResultsGrid">
                    <!-- 검색 결과가 여기에 동적으로 로드됩니다 -->
                    <div class="loading-indicator">
                        <div class="loading-spinner"></div>
                        <p>검색 결과를 불러오는 중...</p>
                    </div>
                </div>
            </section>
        </div>
    </main>
    
    <footer style="text-align:center; color:#888; padding:24px 0 12px 0; font-size:0.95em;">
        &copy; 2024 분실물 찾기 서비스. All rights reserved.
    </footer>

    <!-- 통합 인증 모달 -->
    <div id="authModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeAuthModal()">&times;</span>
            
            <!-- 로그인 폼 -->
            <div id="loginForm" class="auth-form">
                <h2>로그인</h2>
                <form id="emailLoginForm">
                    <div class="form-group">
                        <label for="loginEmail">이메일</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">비밀번호</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="submit-button">로그인</button>
                </form>
                
                <div class="auth-links">
                    <a href="#" class="auth-link" onclick="showSignupForm()">회원가입</a>
                    <span class="auth-separator">|</span>
                    <a href="#" class="auth-link" onclick="showPasswordReset()">비밀번호 찾기</a>
                </div>
                
                <div class="social-login">
                    <button onclick="signInWithGoogle()" class="social-btn google-btn">
                        <i class="fab fa-google"></i> Google로 로그인
                    </button>
                </div>
            </div>
            
            <!-- 회원가입 폼 -->
            <div id="signupForm" class="auth-form" style="display: none;">
                <h2>회원가입</h2>
                <form id="emailSignupForm">
                    <div class="form-group">
                        <label for="signupEmail">이메일</label>
                        <input type="email" id="signupEmail" required>
                        <div id="emailStatus" class="email-status"></div>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">비밀번호</label>
                        <input type="password" id="signupPassword" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="signupPasswordConfirm">비밀번호 확인</label>
                        <input type="password" id="signupPasswordConfirm" required minlength="6">
                    </div>
                    <button type="submit" class="submit-button">회원가입</button>
                </form>
                
                <div class="auth-links">
                    <a href="#" class="auth-link" onclick="showLoginForm()">이미 계정이 있으신가요? 로그인</a>
                </div>
            </div>
            
            <!-- 비밀번호 재설정 폼 -->
            <div id="passwordResetForm" class="auth-form" style="display: none;">
                <h2>비밀번호 재설정</h2>
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="resetEmail">이메일</label>
                        <input type="email" id="resetEmail" required>
                    </div>
                    <button type="submit" class="submit-button">비밀번호 재설정 이메일 전송</button>
                </form>
                
                <div class="auth-links">
                    <a href="#" class="auth-link" onclick="showLoginForm()">로그인으로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
    <script src="search-results.js"></script>
</body>
</html>
