<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 - 분실물 찾기</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <nav class="nav">
                <a href="buyong.html" class="back-to-hub-btn">← 부용관으로 돌아가기</a>
                <a href="index.html" class="logo">부용고 분실물 찾기</a>
                
                <!-- 햄버거 메뉴 버튼 (모바일) -->
                <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
                
                <!-- 데스크톱 네비게이션 -->
                <ul class="nav-menu desktop-menu">
                    <li class="nav-item"><a href="index.html" class="nav-link">홈</a></li>
                    <li class="nav-item"><a href="list.html" class="nav-link">등록된 분실물</a></li>
                    <li class="nav-item"><a href="register.html" class="nav-link">분실물 등록/찾기</a></li>
                </ul>
                
                <!-- 데스크톱 인증 -->
                <div id="auth-container" class="desktop-auth">
                    <button id="loginBtn" class="auth-btn" onclick="openAuthModal()">로그인/회원가입</button>
                </div>
                <div id="user-info" class="desktop-user" style="display: none;"></div>
            </nav>
            
            <!-- 모바일 메뉴 오버레이 -->
            <div class="mobile-menu-overlay" id="mobileMenuOverlay">
                <div class="mobile-menu-content">
                    <div class="mobile-menu-header">
                        <h3>메뉴</h3>
                        <button class="mobile-menu-close" onclick="toggleMobileMenu()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <div class="mobile-menu-main">
                        <ul class="mobile-nav-menu">
                            <li class="mobile-nav-item">
                                <a href="index.html" class="mobile-nav-link" onclick="toggleMobileMenu()">
                                    <i class="fas fa-home"></i>
                                    <span>홈</span>
                                </a>
                            </li>
                            <li class="mobile-nav-item">
                                <a href="list.html" class="mobile-nav-link" onclick="toggleMobileMenu()">
                                    <i class="fas fa-list"></i>
                                    <span>등록된 분실물</span>
                                </a>
                            </li>
                            <li class="mobile-nav-item">
                                <a href="register.html" class="mobile-nav-link" onclick="toggleMobileMenu()">
                                    <i class="fas fa-plus-circle"></i>
                                    <span>분실물 등록/찾기</span>
                                </a>
                            </li>
                        </ul>
                        
                        <!-- 모바일 인증 -->
                        <div class="mobile-auth-section">
                            <div id="mobile-auth-container">
                                <button class="mobile-auth-btn" onclick="openAuthModal(); toggleMobileMenu();">
                                    <i class="fas fa-sign-in-alt"></i>
                                    <span>로그인/회원가입</span>
                                </button>
                            </div>
                            <div id="mobile-user-info" style="display: none;"></div>
                        </div>
                    </div>
                    
                    <!-- 모바일 메뉴 하단에 부용관으로 돌아가기 버튼 추가 -->
                    <div class="mobile-back-to-hub-section">
                        <a href="buyong.html" class="mobile-back-to-hub-btn" onclick="toggleMobileMenu()">
                            <i class="fas fa-arrow-left"></i>
                            <span>부용관으로 돌아가기</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="profile-container">
        <div class="profile-sidebar">
            <div class="user-info">
                <h2>내 프로필</h2>
                <p class="user-email-display"></p>
            </div>
        </div>
        
        <div class="profile-content">
            <h3>내가 작성한 게시글</h3>
            <div class="posts-grid" id="userPosts">
                <!-- 게시글이 여기에 동적으로 로드됩니다 -->
            </div>
        </div>
    </div>

    <!-- 삭제 확인 팝업 -->
    <div id="deleteConfirmPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content delete-popup">
            <div class="popup-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3>게시물 삭제</h3>
            <p>정말로 이 게시물을 삭제하시겠습니까?</p>
            <p class="delete-warning">삭제된 게시물은 복구할 수 없습니다.</p>
            <div class="popup-buttons">
                <button onclick="confirmDelete()" class="popup-button delete-btn">삭제</button>
                <button onclick="closeDeletePopup()" class="popup-button cancel-btn">취소</button>
            </div>
        </div>
    </div>

    <!-- 수정 팝업 -->
    <div id="editPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content edit-popup">
            <div class="popup-header">
                <h3>게시물 수정</h3>
                <button onclick="closeEditPopup()" class="popup-close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="editForm" class="edit-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="editItemName">물건명 <span class="required">*</span></label>
                        <input type="text" id="editItemName" name="itemName" required>
                    </div>
                    <div class="form-group">
                        <label for="editCategory">분류 <span class="required">*</span></label>
                        <select id="editCategory" name="category" required>
                            <option value="">분류를 선택하세요</option>
                            <option value="전자기기">전자기기</option>
                            <option value="지갑/카드">지갑/카드</option>
                            <option value="의류/신발">의류/신발</option>
                            <option value="가방/백팩">가방/백팩</option>
                            <option value="서적/문구">서적/문구</option>
                            <option value="악세서리">악세서리</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="editDate">날짜 <span class="required">*</span></label>
                    <input type="date" id="editDate" name="date" required>
                </div>
                <div class="form-group">
                    <label for="editLocation">장소 <span class="required">*</span></label>
                    <input type="text" id="editLocation" name="location" required>
                </div>
                <div class="form-group">
                    <label for="editDescription">상세 설명</label>
                    <textarea id="editDescription" name="description" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editContactName">이름 <span class="required">*</span></label>
                        <input type="text" id="editContactName" name="contactName" required>
                    </div>
                    <div class="form-group">
                        <label for="editContactPhone">연락처 <span class="required">*</span></label>
                        <input type="text" id="editContactPhone" name="contactPhone" required>
                    </div>
                </div>
                <div class="popup-buttons">
                    <button type="submit" class="popup-button save-btn">저장</button>
                    <button type="button" onclick="closeEditPopup()" class="popup-button cancel-btn">취소</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 통합 인증 모달 -->
    <div id="authModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeAuthModal()">&times;</span>
            
            <!-- 로그인 폼 -->
            <div id="loginForm" class="auth-form">
                <h2>로그인</h2>
                <form id="emailLoginForm">
                    <div class="form-group">
                        <label for="loginEmail">이메일</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">비밀번호</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="submit-button">로그인</button>
                </form>
                
                <div class="social-login">
                    <p style="text-align: center; margin: 20px 0; color: #666;">또는</p>
                    <button onclick="signInWithGoogle()" class="social-btn google-btn">
                        Google로 로그인
                    </button>
                </div>
                
                <div class="auth-links">
                    <a href="#" onclick="showSignupForm()" class="auth-link">회원가입</a>
                    <span class="auth-separator">|</span>
                    <a href="#" onclick="showPasswordReset()" class="auth-link">비밀번호 찾기</a>
                </div>
            </div>
            
            <!-- 회원가입 폼 -->
            <div id="signupForm" class="auth-form" style="display: none;">
                <h2>회원가입</h2>
                <form id="emailSignupForm">
                    <div class="form-group">
                        <label for="signupEmail">이메일</label>
                        <input type="email" id="signupEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">비밀번호 (6자 이상)</label>
                        <input type="password" id="signupPassword" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="signupPasswordConfirm">비밀번호 확인</label>
                        <input type="password" id="signupPasswordConfirm" required minlength="6">
                    </div>
                    <button type="submit" class="submit-button">회원가입</button>
                </form>
                
                <div class="auth-links">
                    <a href="#" onclick="showLoginForm()" class="auth-link">로그인으로 돌아가기</a>
                </div>
            </div>
            
            <!-- 비밀번호 재설정 폼 -->
            <div id="passwordResetForm" class="auth-form" style="display: none;">
                <h2>비밀번호 재설정</h2>
                <p style="text-align: center; margin-bottom: 20px; color: #666;">
                    가입한 이메일 주소를 입력하시면 비밀번호 재설정 링크를 보내드립니다.
                </p>
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="resetEmail">이메일</label>
                        <input type="email" id="resetEmail" required>
                    </div>
                    <button type="submit" class="submit-button">재설정 링크 보내기</button>
                </form>
                
                <div class="auth-links">
                    <a href="#" onclick="showLoginForm()" class="auth-link">로그인으로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
    <script>
        // 수정 폼 이벤트 리스너 추가
        document.addEventListener('DOMContentLoaded', function() {
            const editForm = document.getElementById('editForm');
            if (editForm) {
                editForm.addEventListener('submit', handleEditSubmit);
            }
        });
    </script>
</body>
</html>
