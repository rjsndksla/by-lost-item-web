<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 동아리 프로필</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
      /* 동아리 프로필 페이지 모바일 최적화 */
      @media (max-width: 768px) {
        .profile-container {
          padding: 20px;
          margin-top: 80px;
          flex-direction: column;
        }
        
        .profile-sidebar {
          width: 100%;
          margin-bottom: 30px;
          text-align: center;
        }
        
        .profile-sidebar h2 {
          font-size: 2rem;
          margin-bottom: 15px;
        }
        
        .user-email-display {
          font-size: 1.1rem;
          color: #666;
        }
        
        .profile-content {
          width: 100%;
        }
        
        .profile-content h3 {
          font-size: 1.8rem;
          margin-bottom: 25px;
          text-align: center;
        }
        
        .posts-grid {
          gap: 20px;
        }
        
        .post-card {
          padding: 25px 20px;
          border-radius: 16px;
          margin-bottom: 20px;
        }
        
        .post-card h3 {
          font-size: 1.4rem;
          margin-bottom: 15px;
        }
        
        .post-card p {
          font-size: 1.1rem;
          line-height: 1.6;
          margin-bottom: 12px;
        }
        
        .post-card img {
          width: 100%;
          height: 200px;
          border-radius: 12px;
          margin-bottom: 15px;
          object-fit: cover;
        }
        
        .action-button {
          font-size: 1.2rem;
          padding: 8px 12px;
        }
        
        .action-menu button {
          font-size: 1rem;
          padding: 8px 12px;
        }
        
        .no-posts {
          font-size: 1.2rem;
          text-align: center;
          color: #666;
          padding: 40px 20px;
        }
      }
      
      @media (max-width: 480px) {
        .profile-container {
          padding: 15px;
        }
        
        .profile-sidebar h2 {
          font-size: 1.8rem;
          margin-bottom: 12px;
        }
        
        .user-email-display {
          font-size: 1rem;
        }
        
        .profile-content h3 {
          font-size: 1.6rem;
          margin-bottom: 20px;
        }
        
        .post-card {
          padding: 20px 15px;
          margin-bottom: 15px;
        }
        
        .post-card h3 {
          font-size: 1.3rem;
          margin-bottom: 12px;
        }
        
        .post-card p {
          font-size: 1rem;
          margin-bottom: 10px;
        }
        
        .post-card img {
          height: 180px;
          margin-bottom: 12px;
        }
        
        .no-posts {
          font-size: 1.1rem;
          padding: 30px 15px;
        }
      }
    </style>
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <nav class="nav">
                <a href="buyong.html" class="back-to-hub-btn">← 부용관으로 돌아가기</a>
                <a href="club.html" class="logo">동아리 온라인 홍보관</a>
                
                <!-- 햄버거 메뉴 버튼 (모바일) -->
                <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
                
                <!-- 데스크톱 네비게이션 -->
                <ul class="nav-menu desktop-menu">
                    <li class="nav-item"><a href="club.html" class="nav-link">홈</a></li>
                    <li class="nav-item"><a href="club-list.html" class="nav-link">동아리 목록</a></li>
                    <li class="nav-item"><a href="club-register.html" class="nav-link">동아리 등록</a></li>
                </ul>
                
                <!-- 데스크톱 인증 -->
                <div id="auth-container" class="desktop-auth">
                    <button id="loginBtn" class="auth-btn" onclick="openAuthModal()">로그인/회원가입</button>
                </div>
                <div id="user-info" class="desktop-user" style="display: none;"></div>
            </nav>
            
            <!-- 모바일 메뉴 오버레이 -->
            <div class="mobile-menu-overlay" id="mobileMenuOverlay">
                <div class="mobile-menu-content">
                    <div class="mobile-menu-header">
                        <h3>메뉴</h3>
                        <button class="mobile-menu-close" onclick="toggleMobileMenu()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <ul class="mobile-nav-menu">
                        <li class="mobile-nav-item">
                            <a href="club.html" class="mobile-nav-link" onclick="toggleMobileMenu()">
                                <i class="fas fa-home"></i>
                                <span>홈</span>
                            </a>
                        </li>
                        <li class="mobile-nav-item">
                            <a href="club-list.html" class="mobile-nav-link" onclick="toggleMobileMenu()">
                                <i class="fas fa-list"></i>
                                <span>동아리 목록</span>
                            </a>
                        </li>
                        <li class="mobile-nav-item">
                            <a href="club-register.html" class="mobile-nav-link" onclick="toggleMobileMenu()">
                                <i class="fas fa-plus-circle"></i>
                                <span>동아리 등록</span>
                            </a>
                        </li>
                    </ul>
                    
                    <!-- 부용관으로 돌아가기 (맨 아래) -->
                    <div class="mobile-back-section">
                        <a href="buyong.html" class="mobile-nav-link back-link" onclick="toggleMobileMenu()">
                            <i class="fas fa-arrow-left"></i>
                            <span>부용관으로 돌아가기</span>
                        </a>
                    </div>
                    
                    <!-- 모바일 인증 -->
                    <div class="mobile-auth-section">
                        <div id="mobile-auth-container">
                            <button class="mobile-auth-btn" onclick="openAuthModal(); toggleMobileMenu();">
                                <i class="fas fa-sign-in-alt"></i>
                                <span>로그인/회원가입</span>
                            </button>
                        </div>
                        <div id="mobile-user-info" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="profile-container">
        <div class="profile-sidebar">
            <div class="user-info">
                <h2>내 동아리 프로필</h2>
                <p class="user-email-display"></p>
            </div>
        </div>
        <div class="profile-content">
            <h3>내가 등록한 동아리</h3>
            <div class="posts-grid" id="userClubPosts">
                <!-- 동아리 게시글이 여기에 동적으로 로드됩니다 -->
            </div>
        </div>
    </div>

    <!-- 인증 모달 (club.html과 동일) -->
    <div id="authModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeAuthModal()">&times;</span>
            <!-- 로그인 폼 -->
            <div id="loginForm" class="auth-form">
                <h2>로그인</h2>
                <form id="emailLoginForm">
                    <div class="form-group">
                        <label for="loginEmail">이메일</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">비밀번호</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="submit-button">로그인</button>
                </form>
                <div class="social-login">
                    <p style="text-align: center; margin: 20px 0; color: #666;">또는</p>
                    <button onclick="signInWithGoogle()" class="social-btn google-btn">Google로 로그인</button>
                </div>
                <div class="auth-links">
                    <a href="#" onclick="showSignupForm()" class="auth-link">회원가입</a>
                    <span class="auth-separator">|</span>
                    <a href="#" onclick="showPasswordReset()" class="auth-link">비밀번호 찾기</a>
                </div>
            </div>
            <!-- 회원가입 폼 -->
            <div id="signupForm" class="auth-form" style="display: none;">
                <h2>회원가입</h2>
                <form id="emailSignupForm">
                    <div class="form-group">
                        <label for="signupEmail">이메일</label>
                        <input type="email" id="signupEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">비밀번호 (6자 이상)</label>
                        <input type="password" id="signupPassword" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="signupPasswordConfirm">비밀번호 확인</label>
                        <input type="password" id="signupPasswordConfirm" required minlength="6">
                    </div>
                    <button type="submit" class="submit-button">회원가입</button>
                </form>
                <div class="auth-links">
                    <a href="#" onclick="showLoginForm()" class="auth-link">로그인으로 돌아가기</a>
                </div>
            </div>
            <!-- 비밀번호 재설정 폼 -->
            <div id="passwordResetForm" class="auth-form" style="display: none;">
                <h2>비밀번호 재설정</h2>
                <p style="text-align: center; margin-bottom: 20px; color: #666;">
                    가입한 이메일 주소를 입력하시면 비밀번호 재설정 링크를 보내드립니다.
                </p>
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="resetEmail">이메일</label>
                        <input type="email" id="resetEmail" required>
                    </div>
                    <button type="submit" class="submit-button">재설정 링크 보내기</button>
                </form>
                <div class="auth-links">
                    <a href="#" onclick="showLoginForm()" class="auth-link">로그인으로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 팝업 -->
    <div id="deleteConfirmPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content delete-popup">
            <div class="popup-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3>동아리 게시물 삭제</h3>
            <p>정말로 이 동아리 게시물을 삭제하시겠습니까?</p>
            <p class="delete-warning">삭제된 게시물은 복구할 수 없습니다.</p>
            <div class="popup-buttons">
                <button onclick="confirmDelete()" class="popup-button delete-btn">삭제</button>
                <button onclick="closeDeletePopup()" class="popup-button cancel-btn">취소</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
    <script>
    // club_profile.html 전용: 내 동아리 게시글만 불러오기
    document.addEventListener('DOMContentLoaded', async function() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = 'club.html';
            return;
        }
        document.querySelector('.user-email-display').textContent = user.email;
        // 동아리 게시글만 불러오기 (테이블명/필드명은 실제 구조에 맞게 수정 필요)
        const { data: posts, error } = await supabase
            .from('clubs')
            .select('*')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false });
        const postsGrid = document.getElementById('userClubPosts');
        if (error || !posts || posts.length === 0) {
            postsGrid.innerHTML = '<p class="no-posts">등록한 동아리 게시글이 없습니다.</p>';
            return;
        }
        postsGrid.innerHTML = posts.map(post => `
            <div class="post-card" data-post-id="${post.id}">
                <div class="post-header">
                    <h3>${post.club_name || ''}</h3>
                    <div class="post-actions">
                        <button class="action-button" onclick="toggleActionMenu(this)">⋮</button>
                        <div class="action-menu">
                            <button onclick="editClubPost('${post.id}')">수정</button>
                            <button class="delete-btn" onclick="showDeleteConfirmPopup('${post.id}')">삭제</button>
                        </div>
                    </div>
                </div>
                <div class="post-content">
                    <p><strong>카테고리:</strong> ${post.club_category || ''}</p>
                    <p><strong>소개:</strong> ${post.club_desc || ''}</p>
                    <p><strong>연락처:</strong> ${post.club_contact || ''}</p>
                    ${post.poster_url ? `<img src="${post.poster_url}" alt="동아리 포스터" class="post-image">` : ''}
                </div>
            </div>
        `).join('');
        document.addEventListener('click', closeAllActionMenus);
    });
    // 수정/삭제 함수는 script.js에 추가 필요
    </script>
</body>
</html>
